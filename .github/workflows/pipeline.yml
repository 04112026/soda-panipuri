
name: Parallel Docker API Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Java Docker image
        run: docker build -t demo-java:${{ github.sha }} ./java-api

  node-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Node Docker image
        run: docker build -t demo-node:${{ github.sha }} ./node-api

  python-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Python Docker image
        run: docker build -t demo-python:${{ github.sha }} ./python-api

  # Push Java Docker image to AWS ECR
  push-to-ecr:
    needs: [java-build, node-build, python-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Verify AWS connection
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Docker Image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: training/java-api
          TAG: ${{ github.sha }}
        run: |
          docker build -t demo-java:$TAG ./java-api
          docker tag demo-java:$TAG "$REGISTRY/$REPO:$TAG"
          docker push "$REGISTRY/$REPO:$TAG"

  # Deployment jobs run in parallel
  java-deploy:
    needs: [push-to-ecr]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Simulated DEV deployment - Java API'

  node-deploy:
    needs: [push-to-ecr]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Simulated DEV deployment - Node API'

  python-deploy:
    needs: [push-to-ecr]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Simulated DEV deployment - Python API'
