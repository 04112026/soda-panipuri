name: EKS Training - Terraform and Deployment
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy or destroy the chargeable training lab
        type: choice
        options: [deploy, destroy]
        default: deploy
      local_principal_arn:
        description: Optional IAM user or role ARN for laptop access (leave blank for CI only)
        type: string
        required: false
        default: ''
      enable_python:
        description: Deploy optional third Python API pod
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: training-eks-lab
  cancel-in-progress: false
env:
  AWS_REGION: eu-north-1
  TF_IN_AUTOMATION: 'true'
  # IAM role ARNs are identifiers, not credentials. Secret override is optional.
  TF_VAR_ci_role_arn: ${{ secrets.AWS_INFRA_ROLE_ARN || 'arn:aws:iam::686511309747:role/GitHubActions-EKS-Infra-Role' }}
  TF_VAR_local_principal_arn: ${{ inputs.local_principal_arn || vars.EKS_LOCAL_PRINCIPAL_ARN || '' }}
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'training-tfstate-686511309747' }}
  IMAGE_TAG: eks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      java_repository: ${{ steps.outputs.outputs.java_repository }}
      node_repository: ${{ steps.outputs.outputs.node_repository }}
      python_repository: ${{ steps.outputs.outputs.python_repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_VAR_ci_role_arn }}
          aws-region: eu-north-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Bootstrap Terraform state bucket
        run: bash scripts/bootstrap-state.sh
      - name: Provision EKS, RDS and ECR
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          aws sts get-caller-identity
          terraform -chdir=terraform/infra init -backend-config="bucket=$STATE_BUCKET"
          terraform -chdir=terraform/infra validate
          terraform -chdir=terraform/infra plan -out=plan.tfplan
          terraform -chdir=terraform/infra apply -auto-approve plan.tfplan
      - id: outputs
        name: Export registry URLs
        run: |
          for app in java node python; do
            printf '%s_repository=%s\n' "$app" "$(terraform -chdir=terraform/infra output -raw "${app}_repository")" >> "$GITHUB_OUTPUT"
          done
  publish:
    needs: infrastructure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [java, node, python]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_VAR_ci_role_arn }}
          aws-region: eu-north-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish image
        env:
          APP: ${{ matrix.app }}
          JAVA_REPOSITORY: ${{ needs.infrastructure.outputs.java_repository }}
          NODE_REPOSITORY: ${{ needs.infrastructure.outputs.node_repository }}
          PYTHON_REPOSITORY: ${{ needs.infrastructure.outputs.python_repository }}
        run: |
          set -euo pipefail
          case "$APP" in
            java) repo="$JAVA_REPOSITORY" ;;
            node) repo="$NODE_REPOSITORY" ;;
            python) repo="$PYTHON_REPOSITORY" ;;
          esac
          docker build -t "$repo:$IMAGE_TAG" "./$APP-api"
          docker push "$repo:$IMAGE_TAG"
  deploy:
    needs: [infrastructure, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TF_VAR_enable_python: ${{ inputs.enable_python }}
      JAVA_REPOSITORY: ${{ needs.infrastructure.outputs.java_repository }}
      NODE_REPOSITORY: ${{ needs.infrastructure.outputs.node_repository }}
      PYTHON_REPOSITORY: ${{ needs.infrastructure.outputs.python_repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_VAR_ci_role_arn }}
          aws-region: eu-north-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Configure Kubernetes access and secret
        run: |
          set -euo pipefail
          terraform -chdir=terraform/infra init -backend-config="bucket=$STATE_BUCKET"
          aws eks update-kubeconfig --name training-eks --region "$AWS_REGION"
          kubectl get nodes
          bash scripts/configure-k8s.sh
      - name: Deploy container images from ECR
        run: |
          set -euo pipefail
          export TF_VAR_java_image="$JAVA_REPOSITORY:$IMAGE_TAG"
          export TF_VAR_node_image="$NODE_REPOSITORY:$IMAGE_TAG"
          export TF_VAR_python_image="$PYTHON_REPOSITORY:$IMAGE_TAG"
          terraform -chdir=terraform/workloads init -backend-config="bucket=$STATE_BUCKET"
          terraform -chdir=terraform/workloads validate
          terraform -chdir=terraform/workloads plan -out=plan.tfplan
          terraform -chdir=terraform/workloads apply -auto-approve plan.tfplan
      - name: Show pod logs and services
        if: always()
        run: |
          kubectl -n training get pods,svc -o wide || true
          kubectl -n training logs deploy/java-api --tail=15 || true
          kubectl -n training logs deploy/node-api --tail=15 || true
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_VAR_ci_role_arn }}
          aws-region: eu-north-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Destroy workloads first, then AWS infrastructure
        run: |
          set -euo pipefail
          terraform -chdir=terraform/infra init -backend-config="bucket=$STATE_BUCKET"
          # If workloads state exists, clean it up while the API is reachable.
          keys=$(aws s3api list-objects-v2 --bucket "$STATE_BUCKET" --prefix training-eks/workloads.tfstate --query 'Contents[].Key' --output json)
          managed=0
          if printf '%s\n' "$keys" | jq -e '(. // []) | index("training-eks/workloads.tfstate") != null' >/dev/null; then
            state=$(aws s3 cp "s3://$STATE_BUCKET/training-eks/workloads.tfstate" - --only-show-errors)
            managed=$(printf '%s' "$state" | jq '[.resources[]? | select(.mode == "managed") | .instances[]?] | length')
            unset state
          fi
          if (( managed > 0 )); then
            aws eks update-kubeconfig --name training-eks --region "$AWS_REGION"
            export TF_VAR_java_image=unused TF_VAR_node_image=unused TF_VAR_python_image=unused TF_VAR_enable_python=true
            terraform -chdir=terraform/workloads init -backend-config="bucket=$STATE_BUCKET"
            terraform -chdir=terraform/workloads destroy -auto-approve
            kubectl delete namespace training --ignore-not-found --timeout=120s
          fi
          terraform -chdir=terraform/infra destroy -auto-approve
